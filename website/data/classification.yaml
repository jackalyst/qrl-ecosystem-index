project_types:
  - id: protocol
    taxonomy_slug: protocols
    label: Protocols
    description: On-chain or protocol-level logic used by people or other software.
    ideas:
      - Financial, governance, identity, interoperability, and oracle protocols.
      - Testnet-first contract systems with documented deployments and source evidence.
  - id: application
    taxonomy_slug: applications
    label: Applications
    description: User-facing software and interfaces for interacting with QRL or a protocol.
    ideas:
      - Wallets, explorers, payment applications, dashboards, marketplaces, and games.
      - Mobile, desktop, browser, and web experiences that make QRL easier to use.
  - id: infrastructure
    taxonomy_slug: infrastructure
    label: Infrastructure
    description: Networked software and operated services that make QRL available, reliable, or queryable.
    ideas:
      - Node clients, validators, RPC services, indexers, relayers, monitoring, and faucets.
      - Reproducible operator stacks with transparent health and availability information.
  - id: tooling
    taxonomy_slug: tooling
    label: Tooling
    description: Software used to build, test, deploy, integrate, inspect, or verify QRL projects.
    ideas:
      - Libraries, SDKs, CLIs, compilers, frameworks, IDE support, and security tools.
      - Reusable examples and deployment systems for QRL 1.x and QRL 2.0 builders.
  - id: resource
    taxonomy_slug: resources
    label: Community & Resources
    description: People-facing ecosystem information, research, coordination, and programs.
    ideas:
      - Education, research, standards, media, forums, events, grants, and bounties.
      - Public coordination resources that help people understand and contribute to QRL.

categories:
  - id: finance
    label: Finance
    description: Trading, lending, staking, liquidity, treasury, and financial research.
    ideas:
      - Financial protocols and transparent analytics for QRL assets and network economics.
  - id: payments-commerce
    label: Payments & commerce
    description: Checkout, invoicing, marketplaces, payment requests, and merchant experiences.
    ideas:
      - Payment links, point-of-sale tools, invoicing, and peer-to-peer commerce.
  - id: assets-tokenization
    label: Assets & tokenization
    description: Fungible tokens, collections, issuance, ownership, and asset administration.
    ideas:
      - Token creation, metadata, distribution, verification, and collection management.
  - id: identity-naming-privacy
    label: Identity, naming & privacy
    description: Names, profiles, credentials, attestations, reputation, and privacy.
    ideas:
      - Human-readable names, credentials, privacy tools, and reputation systems.
  - id: governance-coordination
    label: Governance & coordination
    description: Proposals, voting, delegation, treasuries, grants, and contributor coordination.
    ideas:
      - Governance interfaces, transparent programs, and public contribution workflows.
  - id: interoperability-messaging-data
    label: Interoperability, messaging & data
    description: Cross-chain exchange, bridges, oracles, messaging, and data publication.
    ideas:
      - Atomic swaps, bridge research, signed data feeds, and cross-system messaging.
  - id: gaming-virtual-worlds
    label: Gaming & virtual worlds
    description: Games, game economies, virtual experiences, and game-adjacent assets.
    ideas:
      - On-chain games, fair-selection mechanics, and interoperable game assets.
  - id: social-creator-content
    label: Social, creator & content
    description: Social applications, creator tools, publishing, media, and content discovery.
    ideas:
      - Social spaces, publishing tools, creator services, and community media.
  - id: security-custody-account-management
    label: Security, custody & account management
    description: Wallets, signing, custody, recovery, permissions, and transaction safety.
    ideas:
      - Multisig, hardware signing, account recovery, simulation, and key-management tools.
  - id: network-operations
    label: Network operations
    description: Running, querying, observing, and maintaining QRL networks and services.
    ideas:
      - Validators, node services, RPC infrastructure, explorers, monitoring, and mining.
  - id: developer-experience
    label: Developer experience
    description: Building, testing, deploying, debugging, and integrating QRL software.
    ideas:
      - Frameworks, packages, IDE extensions, test systems, and deployment automation.
  - id: education-research-ecosystem
    label: Education, research & ecosystem
    description: Learning, research, standards, reporting, events, and ecosystem programs.
    ideas:
      - Technical reports, QIPs, learning paths, events, grants, and contributor programs.
  - id: utility-storage-compute
    label: Utility, storage & compute
    description: General-purpose utilities, storage, compute, notarization, and native chain functions.
    ideas:
      - QRL-native utilities, storage services, compute systems, and notarization workflows.

capabilities:
  - id: analytics
    label: Analytics
    description: Dashboards, measurements, or analysis of chain, network, or ecosystem data.
  - id: atomic-swap
    label: Atomic swaps
    description: Cross-chain asset exchange without a centralized intermediary.
  - id: cli
    label: CLI tools
    description: Command-line interfaces for completing QRL tasks or automating workflows.
  - id: compiler
    label: Compilers
    description: Tools that compile source code into QRL-compatible smart contracts or programs.
  - id: contract-template
    label: Contract templates
    description: Reusable smart-contract examples and project starters.
  - id: deployment
    label: Deployment tooling
    description: Tools that install or deploy nodes, contracts, or applications.
  - id: dex
    label: Decentralized exchanges
    description: Decentralized asset trading and liquidity protocols.
  - id: education
    label: Education
    description: Tutorials, guides, courses, or other structured learning material.
  - id: explorer
    label: Explorers
    description: Interfaces for browsing blocks, transactions, accounts, contracts, or assets.
  - id: faucet
    label: Faucets
    description: Services or tools that distribute test-network funds.
  - id: hardware-wallet
    label: Hardware wallets
    description: Wallet software or integrations that use a dedicated hardware signer.
  - id: key-management
    label: Key management
    description: Tools for creating, importing, exporting, recovering, or protecting key material.
  - id: library
    label: Libraries
    description: Reusable software packages for building QRL-compatible systems.
  - id: liquid-staking
    label: Liquid staking
    description: Staking systems that issue or manage a transferable representation of staked assets.
  - id: marketplace
    label: Marketplaces
    description: Applications for discovering and exchanging goods or services.
  - id: mining-pool
    label: Mining pools
    description: Services that coordinate proof-of-work miners and payouts.
  - id: news
    label: News & media
    description: Reporting, media, and recurring updates about QRL and its ecosystem.
  - id: node-client
    label: Node clients
    description: Software for connecting to and participating in a QRL network.
  - id: notarization
    label: Notarization
    description: Tools that anchor, timestamp, or verify data and proofs.
  - id: oracle
    label: Oracles
    description: Systems that publish external data for use by on-chain applications.
  - id: payments
    label: Payments
    description: Tools for sending, requesting, receiving, or accepting QRL payments.
  - id: prediction-market
    label: Prediction markets
    description: Markets for creating or trading positions on event outcomes.
  - id: rpc
    label: RPC services
    description: Network APIs and hosted endpoints used by applications and operators.
  - id: sdk
    label: SDKs
    description: Higher-level development kits for integrating QRL into applications.
  - id: staking
    label: Staking
    description: Systems for locking or delegating assets to participate or earn rewards.
  - id: token-creator
    label: Token creation
    description: Tools for creating, configuring, or deploying tokens.
  - id: validator
    label: Validators
    description: Software for participating in proof-of-stake consensus.
  - id: wallet
    label: Wallets
    description: Interactive software for creating or using QRL wallets and accounts.
  - id: wallet-connector
    label: Wallet connectors
    description: Integrations that connect applications to compatible wallet providers.

platforms:
  - id: web
    label: Web
    description: Runs as a web application in a browser.
  - id: browser-extension
    label: Browser extension
    description: Installs as an extension in a supported web browser.
  - id: desktop
    label: Desktop
    description: Installs as a desktop application.
  - id: mobile
    label: Mobile
    description: Installs as a mobile application.

networks:
  - id: qrl-1-mainnet
    label: QRL 1.x Mainnet
    generation: 1.x
    environment: mainnet
  - id: qrl-1-testnet
