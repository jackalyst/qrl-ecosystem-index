{{ $item := .item }}
{{ $count := .count }}
{{ $status := .status }}
<article class="coverage-card"{{ with .id }} id="{{ . }}"{{ end }}>
    <header>
        <div>
            <p class="coverage-status">{{ $status }}</p>
            <h3>{{ $item.label | default $item.title }}</h3>
            {{ with .parent }}<p class="coverage-parent">{{ . }}</p>{{ end }}
        </div>
        <span class="coverage-count">{{ $count }}</span>
    </header>
    <p>{{ $item.description }}</p>
    <ul>
        {{ range $item.ideas }}
        <li>{{ . }}</li>
        {{ end }}
    </ul>
</article>
