{{- with site.Config.Services.GoogleAnalytics.ID -}}
<script>
(() => {
    const measurementID = {{ . | jsonify }};
    const disableKey = `ga-disable-${measurementID}`;
    const scriptID = "qrl-google-analytics";
    let analyticsStarted = false;

    const doNotTrackEnabled = () => {
        const signals = [navigator.doNotTrack, window.doNotTrack, navigator.msDoNotTrack];
        return signals.some((signal) => signal === "1" || signal === "yes");
    };

    const ensureGtag = () => {
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function gtag() {
            window.dataLayer.push(arguments);
        };
        return window.gtag;
    };

    const loadAnalytics = () => {
        if (doNotTrackEnabled()) {
            return false;
        }

        const gtag = ensureGtag();
        window[disableKey] = false;

        if (analyticsStarted) {
            gtag("consent", "update", {
                analytics_storage: "granted"
            });
            return true;
        }

        analyticsStarted = true;
        gtag("js", new Date());
        gtag("consent", "default", {
            ad_storage: "denied",
            analytics_storage: "denied",
            ad_user_data: "denied",
            ad_personalization: "denied",
            wait_for_update: 500
        });
        gtag("consent", "update", {
            analytics_storage: "granted"
        });
        gtag("config", measurementID);

        if (document.getElementById(scriptID)) {
            return true;
        }

        const script = document.createElement("script");
        script.id = scriptID;
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(measurementID)}`;
        document.head.appendChild(script);
        return true;
    };

    window.qrlAnalytics = {
        disableKey,
        doNotTrackEnabled,
        load: loadAnalytics
    };
})();
</script>
{{- end -}}
