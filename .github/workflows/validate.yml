name: Validate project data

on:
  pull_request:
    paths:
      - 'projects/**/*.yaml'
      - 'images/logos/**'
      - 'images/screenshots/**'
      - 'schema/project.schema.json'
      - 'website/data/classification.yaml'
      - 'requirements-validation.txt'
      - 'scripts/validate_projects.py'
      - 'scripts/validate_projects_test.py'
      - 'scripts/validate_gallery.py'
      - 'scripts/validate_gallery_test.py'

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install pinned validation dependencies
        run: python3 -m pip install --requirement requirements-validation.txt

      - name: Validate schema v6 projects and media
        run: python3 scripts/validate_projects.py

      - name: Run validator unit tests
        run: python3 -m unittest discover -s scripts -p 'validate_*_test.py'
