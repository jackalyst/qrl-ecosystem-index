name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 0 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.21'

      - name: Get Go dependencies
        run: go mod download

      - name: Install validation dependencies
        run: python3 -m pip install --requirement requirements-validation.txt

      - name: Validate project data
        run: python3 scripts/validate_projects.py

      - name: Run validator unit tests
        run: python3 -m unittest discover -s scripts -p 'validate_*_test.py'

      - name: Test project filter state
        run: node --test tests/project-filters.test.cjs

      - name: Generate project content
        run: go run scripts/generate.go

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.162.1'
          extended: true

      - name: Verify Markdown safety fixture
        run: python3 scripts/validate_markdown_safety.py

      - name: Build Hugo site
        run: hugo --gc --minify --cleanDestinationDir --forceSyncStatic
        working-directory: ./website

      - name: Copy generated JSON index
        run: cp website/static/index.json website/public/index.json

      - name: Validate agent-friendly outputs
        run: python3 scripts/validate_agent_outputs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./website/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
