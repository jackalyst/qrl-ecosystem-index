# QRL Ecosystem Index schema v6 template.
# Copy to projects/active/<id>.yaml, or projects/archived/<id>.yaml only when
# availability is archived. Remove unused examples before submitting.

id: your-project-id
name: Your Project Name

# Independent classification facets. See website/data/classification.yaml.
project_type: application
primary_category: security-custody-account-management
secondary_categories:
  - payments-commerce
capabilities:
  - wallet
  - key-management
# Where a visitor can use the project. Use [] when this does not apply.
platforms:
  - web # web | browser-extension | desktop | mobile
# Search-only terms; these do not create taxonomy pages.
keywords:
  - browser-wallet

# Lifecycle describes separate facts.
maturity: beta # prototype | beta | stable | deprecated
availability: live # live | limited | paused | offline | archived
# maintenance: active # active | low-activity | inactive

# native | deployed | integrated | ecosystem-resource
qrl_relationship: native
qrl_support:
  - generation: "2.0" # 1.x | 2.0
    environments:
      - testnet # mainnet (1.x only) | testnet | devnet (2.0 only) | local-private
    # evidence:
    #   - https://docs.example.com/qrl-support

description: >
  A factual project summary no longer than 280 characters.

publisher:
  name: Your Name or Organization
  url: https://example.com/
maintainers:
  - name: Public Maintainer Name
    contact: https://github.com/example-maintainer

# full | partial | unavailable | not-applicable
source_availability: full
repositories:
  - id: main
    role: client # contracts | frontend | client | sdk | infrastructure | tooling | content | other
    url: https://github.com/example-org/example-project
    license: MIT # Valid SPDX expression or NOASSERTION when genuinely unknown

links:
  - type: website
    url: https://example.com/
    primary: true
  - type: documentation
    url: https://docs.example.com/
  - type: social
    platform: x
    url: https://x.com/example

# Directory-maintained dates.
listed_at: 2026-08-17
data_updated_at: 2026-08-17
# project_launched_at: 2026-08-01
# last_release_at: 2026-08-15
# last_verified_at: 2026-08-17

features:
  - A concise, factual feature
  - Another factual feature

# Protocols require at least one deployment. Other types may add deployments
# when a concrete deployed instance is part of the project.
# deployments:
#   - id: qrl-2-testnet-v2
#     network: qrl-2-testnet-v2
#     operational_state: live # live | limited | paused | offline
#     identifiers:
#       - type: contract
#         value: Q0000000000000000000000000000000000000000
#         role: primary
#     evidence:
#       - https://github.com/example-org/example-project/tree/example-revision
#     source_verification: unverified # verified | unverified | not-applicable | unknown

# Security reports are factual provenance, never an “audited” or “safe” badge.
# security_reviews:
#   - auditor: Example Security
#     report_url: https://security.example.com/report.pdf
#     report_date: 2026-08-01
#     repository_id: main
#     revision: 0123456789abcdef
#     scope: Client signing and transaction submission paths
#     deployment_ids: []
#     remediation_status: not-reported # not-reported | open | partial | completed

# Optional evidence hooks do not produce public trust labels in the v6 launch.
# evidence:
#   - type: qrl-relationship # qrl-relationship | deployment | integration | ownership
#     url: https://docs.example.com/qrl-integration
#     note: Public integration documentation
#     checked_at: 2026-08-17

# relationships:
#   - type: uses-protocol # fork-of | successor-to | frontend-for | uses-protocol | part-of
#     project_id: existing-project-id
# previous_names:
#   - Previous Project Name

# Tokens or collections may be attached to a project; they are not project types.
# assets:
#   - type: token
#     name: Example Token
#     symbol: EXAMPLE
#     deployment_id: qrl-2-testnet-v2
#     identifier: Q0000000000000000000000000000000000000000
#     evidence_url: https://docs.example.com/token

# PNG, WebP, or SVG logos under images/logos/<id>/.
# logos:
#   - path: your-project-id/icon.webp
#     description: Your Project icon

# Gallery images are under images/screenshots/<id>/; YouTube uses only its ID.
# gallery:
#   - type: image
#     path: your-project-id/dashboard.webp
#     caption: Dashboard showing current network activity
#   - type: youtube
#     id: M7lc1UVf-VE
#     caption: Project demonstration

# long_description: |
#   An optional longer Markdown description. Raw HTML is not rendered.
