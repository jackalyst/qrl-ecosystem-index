id: qrl-cli
name: qrl-cli
project_type: tooling
qrl_versions:
  - 1.x
status: production
description: >
  An official command-line client for QRL 1.x wallet creation, balances,
  transfers, messages, notarization, tokens, OTS tracking, address validation,
  offline signing, and scripting against mainnet or testnet nodes.
category: tooling
tags:
  - cli
  - wallet
  - automation
  - npm
author: The QRL Foundation
license: MIT
created: 2026-08-17
updated: 2026-08-17

url: https://www.npmjs.com/package/@theqrl/cli
github: https://github.com/theQRL/qrl-cli

open_source: true
audited: false

features:
  - Wallet creation, balance lookup, transfers, and transaction history
  - Token creation and transfer, messaging, and notarization commands
  - Offline transaction signing and OTS index inspection
  - JSON output and configurable gRPC endpoints for automation

tooling:
  languages:
    - javascript
