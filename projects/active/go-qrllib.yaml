id: go-qrllib
name: Go QRLLIB
project_type: tooling
qrl_versions:
  - 1.x
  - "2.0"
status: development
description: >
  A Go post-quantum cryptography and wallet library for QRL, providing ML-DSA-87,
  ML-KEM-1024, SPHINCS+, QRL 2.0 wallet and address helpers, and legacy XMSS
  compatibility for QRL 1.x migration.
category: library
tags:
  - cryptography
  - mldsa
  - xmss
  - go
author: The QRL
license: MIT
created: 2026-08-17
updated: 2026-08-17

url: https://pkg.go.dev/github.com/theQRL/go-qrllib
github: https://github.com/theQRL/go-qrllib
docs: https://pkg.go.dev/github.com/theQRL/go-qrllib

open_source: true
audited: true
audits:
  - auditor: Trail of Bits
    audit_url: https://github.com/trailofbits/publications/blob/master/reviews/2026-07-thequantumresistantledger-go-qrlliblibrarysecurityreview.pdf

features:
  - FIPS 204 ML-DSA-87 signatures and QRL 2.0 wallet helpers
  - Legacy XMSS signing and verification for QRL 1.x migration
  - ML-KEM-1024 key encapsulation and SPHINCS+ primitives
  - QRL address, descriptor, mnemonic, seed, and checksum utilities

tooling:
  languages:
    - go
