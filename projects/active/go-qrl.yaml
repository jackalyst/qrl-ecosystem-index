updated: 2026-08-17

url: https://github.com/theQRL/go-qrl
github: https://github.com/theQRL/go-qrl
docs: https://test-zond.theqrl.org/install

open_source: true
audited: false

features:
  - Full, archive, and light QRL 2.0 execution-node modes
  - QRVM smart-contract execution and state management
  - HTTP, WebSocket, and IPC JSON-RPC endpoints
  - Contract bindings, QRVM debugging, and network utilities

infrastructure:
