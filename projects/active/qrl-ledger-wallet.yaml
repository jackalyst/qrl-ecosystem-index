id: qrl-ledger-wallet
name: QRL Ledger Wallet
project_type: application
qrl_versions:
  - 1.x
status: production
description: >
  The QRL application for Ledger Nano hardware wallets, keeping XMSS keys
  offline while supporting QRL transfers, messages, multiple address trees,
  OTS tracking, and optional passphrase-protected address spaces.
category: wallet
tags:
  - wallet
  - hardware-wallet
  - ledger
  - xmss
author: The QRL
license: Apache-2.0
created: 2026-08-17
updated: 2026-08-17

url: https://docs.theqrl.org/use/wallet/ledger/overview/
github: https://github.com/theQRL/ledger-qrl-app
docs: https://docs.theqrl.org/use/wallet/ledger/overview/

open_source: true
audited: false

features:
  - Support for Ledger Nano X and Nano S Plus devices
  - XMSS private keys retained on the hardware secure element
  - Dual address-tree support with OTS index tracking
  - Native QRL transfers and message transactions

application:
  platforms:
    - hardware
  supported_networks:
    - mainnet
