id: qrl-contract-example
name: QRL Contract Example
project_type: tooling
qrl_versions:
  - "2.0"
status: development
description: >
  A JavaScript reference project for compiling, deploying, and interacting
  with a Hyperion token contract on QRL 2.0 using @theqrl/web3, including
  on-chain transfers and off-chain balance queries.
category: template
tags:
  - smart-contract
