id: qrl-web3-dapp-example
name: QRL Web3 Wallet dApp Example
project_type: tooling
qrl_versions:
  - "2.0"
status: development
description: >
  An official example dApp demonstrating EIP-6963 discovery, connection, and
  JSON-RPC communication with the QRL Web3 Wallet, including account access,
  transactions, message signing, chain management, and asset requests.
category: educational
tags:
  - dapp
  - example
  - wallet
  - eip-6963
author: The QRL
license: MIT
created: 2026-08-17
updated: 2026-08-17

url: https://github.com/theQRL/zond-web3-wallet-dapp-example
github: https://github.com/theQRL/zond-web3-wallet-dapp-example

open_source: true
audited: false

features:
  - EIP-6963 discovery of installed wallet extensions
  - QRL Web3 Wallet connection and account access
  - Examples for transactions, signatures, permissions, and chain switching
  - Visible JSON-RPC responses and errors for development and debugging

tooling:
  languages:
    - typescript
